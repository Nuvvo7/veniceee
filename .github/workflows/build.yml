name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:winexe /optimize+ /codepage:65001 /out:VeniceAnnihilator.exe /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll Annihilator.cs
      - uses: actions/upload-artifact@v4
        with:
          name: VeniceAnnihilator
          path: VeniceAnnihilator.exe
